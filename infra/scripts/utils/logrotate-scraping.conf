# Residual scraping logs of the Book Dev scraping tools.
# Install example (set GITHUB_ROOT to the Book Dev `github` folder that holds the repository clones):
#   GITHUB_ROOT="$HOME/book-dev/github"
#   sed "s|@GITHUB_ROOT@|$GITHUB_ROOT|g" logrotate-scraping.conf | sudo tee /etc/logrotate.d/solo-scraping
#
@GITHUB_ROOT@/bookchaowalit/public/book-apps/tools/book-*-scraping/data/logs/*.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    create 0644 bookchaowalit bookchaowalit
    dateext
    dateformat -%Y%m%d
    maxsize 10M
}
