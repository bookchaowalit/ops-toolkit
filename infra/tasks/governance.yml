version: '3'

# governance command adapters owned by the Solo Empire control plane.
# Included by ../../Taskfile.yml with the repository root as working directory.
# Product build/test implementations must stay inside their own repository.

tasks:
  test:workspace:
    desc: Test the workspace path registry helpers
    dir: infra
    cmds:
      - bash scripts/setup/run-python3.sh tests/platform/workspace_paths_test.py

  evidence:audit:
    desc: Audit evidence coverage without strict failure
    dir: infra
    cmds:
      - bash scripts/setup/run-python3.sh scripts/utils/evidence_contract_guard.py --audit {{.CLI_ARGS}}

  evidence:audit:strict:
    desc: Run the strict evidence coverage audit
    dir: infra
    cmds:
      - bash scripts/setup/run-python3.sh scripts/utils/evidence_contract_guard.py --audit --strict {{.CLI_ARGS}}

  orchestration:check:
    desc: Fail when active source/docs use legacy root npm orchestration
    dir: infra
    cmds:
      - python3 scripts/setup/run-python3.py scripts/utils/active_orchestration_guard.py

  production-tools:check:
    desc: Check production tools catalog and dashboard drift
    dir: infra
    cmds:
      - python3 scripts/setup/run-python3.py scripts/utils/production_tools_catalog_guard.py --check {{.CLI_ARGS}}

  test:production-tools:
    desc: Test production tool ownership and checkout validation
    dir: infra
    cmds:
      - python3 scripts/setup/run-python3.py tests/quality/production_tools_catalog_guard_test.py

  production-hub:check:
    desc: Check the Production Hub artifact contract and handoff registries
    vars:
      HUB_DIR: '{{.BOOK_DEV_GITHUB}}/bookchaowalit/private/book-production-platform/services/production-hub'
    cmds:
      - |
        if [ -d "{{.HUB_DIR}}" ]; then
          cd "{{.HUB_DIR}}" && python3 "{{.ROOT_DIR}}/infra/scripts/setup/run-python3.py" -m production_hub check
        else
          echo "SKIP: book-production-platform checkout is not present"
        fi

  evidence:check:
    desc: Validate the universal evidence contract
    dir: infra
    cmds:
      - python3 scripts/setup/run-python3.py scripts/utils/evidence_contract_guard.py --check

  governance:check:
    desc: Run the fast governance and boundary checks
    cmds:
      - task: operating:check
      - task: skills:check
      - task: evidence:check
      - task: structure:check

  test:evidence-contract:
    desc: Test the evidence contract
    dir: infra
    cmds:
      - bash scripts/setup/run-python3.sh tests/quality/evidence_contract_test.py

  accounts:isolation:check:
    desc: Keep isolated (Z3) social identities, email addresses, and account secrets out of Git
    dir: infra
    cmds:
      - python3 scripts/setup/run-python3.py scripts/utils/identity_isolation_guard.py {{.CLI_ARGS}}

  test:identity-isolation:
    desc: Test the social identity isolation guard offline
    dir: infra
    cmds:
      - bash scripts/setup/run-python3.sh tests/quality/identity_isolation_guard_test.py
