# Reviewed Trivy exceptions. Every entry needs a statement explaining why it is accepted.
misconfigurations:
  # Repo-level exception (a real finding, not a false positive), time-boxed so it is revisited.
  - id: DS-0002
    paths:
      - "infra/ci-runner/Dockerfile"
    expired_at: 2027-01-17
    statement: >-
      Accepted risk pending an owner decision; the CI rollout must not change the runner image.
      The Railway self-hosted runner image extends myoung34/github-runner, whose entrypoint
      registers the runner and runs jobs as root by default; jobs also need root for
      `start-postgres` (pg_ctlcluster). The container is single-tenant (one repo-scoped runner
      per private repo, no Docker socket). The fix is an image change: RUN_AS_ROOT=false plus a
      sudo rule for start-postgres. Only this rule on this file is ignored; Trivy still scans
      everything else, including other misconfigurations in this Dockerfile.
