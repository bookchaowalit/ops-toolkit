# CI + security baseline (DevSecOps Phase 1). Public repository: GitHub-hosted runners.
# This repository also holds the Railway runner image source (infra/ci-runner); CI does not build it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infra-python:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@c37ef9d113eefb3ed45429717cb7ca201192c3fc # v1.0.1
    with:
      working-directory: infra
      python-version: "3.12"
      # ~300 of the ~340 Python files predate Ruff formatting; reformatting them all in this PR
      # would hide any real change. Format in a dedicated follow-up, then turn this back on.
      format-check: false
      # The repo's own runner: every infra/tests/**/*_test.py script in its own interpreter, with
      # the production Tasks API disabled. Absent sibling checkouts make tests skip themselves.
      test-command: python tests/run_all.py --jobs 4

  infra-node:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-node.yml@c37ef9d113eefb3ed45429717cb7ca201192c3fc # v1.0.1
    with:
      working-directory: infra
      node-version: "22"
      # The npm `test` script runs the Python suite, which the infra-python job already covers.
      test-command: ""

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@c37ef9d113eefb3ed45429717cb7ca201192c3fc # v1.0.1
